name: CGV 요시 팝콘통 재고 모니터링

on:
  schedule:
    - cron: '*/5 * * * *'  # 5분마다 실행
  workflow_dispatch:  # 수동 실행 가능

jobs:
  check-stock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Python 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 라이브러리 설치
        run: pip install requests

      - name: 재고 체크 실행
        env:
          CGV_COOKIE: ${{ secrets.CGV_COOKIE }}
          KAKAO_TOKEN: ${{ secrets.KAKAO_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MY_REPO: ${{ secrets.MY_REPO }}
        run: python cgv_monitor_final_v2.py
